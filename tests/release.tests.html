<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Release da sprint · testes</title>
<link rel="stylesheet" href="../public/capacity.css"><link rel="stylesheet" href="../public/release.css">
<main class="main"><div class="topbar"><button class="hamburger">☰</button></div><div id="fixture" class="content"></div></main><pre id="test-result">RUNNING</pre>
<style>#test-result{position:fixed;bottom:0;left:0;max-height:25px;overflow:auto;background:#fff;font-size:9px;z-index:99}</style>
<style>@media print{#test-result{display:none!important}}</style>
<script>
let mode='success',pending=null,printed=0,printedTitle='',printedGroups=0;
window.print=()=>{window.dispatchEvent(new Event('beforeprint'));printed++;printedTitle=document.title;printedGroups=document.querySelectorAll('.release-group[open]').length;window.dispatchEvent(new Event('afterprint'));};
const doc=sprint=>({sprint,sprints:[17,18,19],dates:{start:'2026-09-28',end:'2026-10-11'},total:sprint===19?0:6,withoutDescription:sprint===19?0:4,staleSummaries:sprint===19?0:1,syncedAt:'2026-10-07T12:00:00Z',commentsUnavailable:sprint===18?1:0,groups:sprint===19?[]:[
 {type:'Melhoria',count:2,items:[{id:'1',title:sprint===18?'Entrega da sprint 18':'Relatório de acompanhamento',description:'Ajustada a apresentação das informações do relatório.',descriptionSource:'resumo',descriptionStale:true,module:'Relatórios',url:'https://empresa.monday.com/boards/123/pulses/1'},{id:'2',title:'Consulta de informações',description:null,module:null,url:null}]},
 {type:'Suporte',count:2,items:[{id:'3',title:'Menu lateral do aplicativo',description:'Corrigida a exibição dos botões do menu lateral.',module:'Aplicativo',url:'https://monday.com/boards/123/pulses/3'},{id:'4',title:'Filtros dos relatórios',description:null,module:null,url:'javascript:alert(1)'}]},
 {type:'Homologação',count:1,items:[{id:'5',title:'Compatibilidade de equipamento',description:null,module:'Integrações',url:null}]},
 {type:'Sem tipo',count:1,items:[{id:'6',title:'<img src=x onerror=alert(1)>',description:null,module:null,url:null}]}
]});
window.mondayRequest=async(path,body)=>{if(mode==='error')throw new Error('Sem conexão');if(mode==='race'&&body.sprint===18)return new Promise(resolve=>{pending=resolve;});return doc(body.sprint||17);};
const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
const load=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.body.append(script);});
(async()=>{
 const checks=[];const check=(name,condition)=>{checks.push(`${condition?'PASS':'FAIL'} ${name}`);if(!condition)throw new Error(name);};
 try{
  const dashboard=await(await fetch('../resources/views/dashboard.blade.php')).text();const style=document.createElement('style');style.textContent=dashboard.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(style);
  document.getElementById('fixture').innerHTML=await(await fetch('../resources/views/release.blade.php')).text();document.getElementById('page-release').classList.add('active');document.querySelector('.cap-heading img').src='../public/yuv-logo.png';
  await load('../public/sprint-rules.js');await load('../public/sprint-panel.js');await load('../public/release.js');document.dispatchEvent(new Event('DOMContentLoaded'));
  SprintRelease.enter();check('Carregamento visível',!document.getElementById('release-loading').hidden);check('Exportação bloqueada durante carregamento',document.getElementById('release-export').disabled);await tick();
  check('Grupos dinâmicos e contagem reconciliada',document.querySelectorAll('.release-delivery').length===6 && document.querySelectorAll('.release-group').length===4 && document.getElementById('release-count').textContent.includes('6 itens'));
  check('Cores por Tipo e fallback consistente',SprintRelease.typeVisual('MELHORIA').color==='green' && SprintRelease.typeVisual('Suporte').color==='red' && SprintRelease.typeVisual('Homologação').color==='purple' && SprintRelease.typeVisual('Novo tipo').color===SprintRelease.typeVisual('Novo tipo').color);
  check('Títulos e descrições renderizados como texto',!document.querySelector('.release-delivery img') && document.getElementById('release-document').textContent.includes('<img src=x onerror=alert(1)>'));
  check('Ausência de comentário não cria descrição',document.querySelector('[data-item-id="2"] p')===null);
  check('Resumo desatualizado sinalizado e situação das descrições exibida',document.querySelector('[data-item-id="1"] .release-stale')!==null && document.querySelector('[data-item-id="2"] .release-stale')===null && document.getElementById('release-summary-status').textContent.includes('1 resumo(s)') && document.getElementById('release-summary-status').textContent.includes('gera os resumos da release da sprint 17'));
  check('Ícone em todas as entregas e módulo somente quando existe',document.querySelectorAll('.release-module svg').length===6 && [...document.querySelectorAll('.release-module')].filter(module=>module.textContent).length===3);
  check('Categorias começam recolhidas',!document.querySelector('.release-group[open]'));
  document.querySelector('.release-group summary').click();await tick();
  check('Expansão individual exibe entregas sem abrir outros grupos',document.querySelectorAll('.release-group[open]').length===1 && document.querySelector('.release-group[open] .release-delivery').getBoundingClientRect().height>0);
  SprintRelease.onDataUpdated();await tick();
  check('Atualização da mesma sprint preserva expansão',document.querySelectorAll('.release-group[open]').length===1);
  check('Links seguros e abertura do card',document.querySelectorAll('.release-delivery a').length===2 && document.querySelector('.release-delivery a').rel==='noopener noreferrer');
  check('PDF habilitado e seletor é o único filtro',!document.getElementById('release-export').disabled && document.querySelectorAll('#page-release select').length===1 && !document.querySelector('#page-release input,#page-release textarea,#page-release form'));
  const previousTitle=document.title;document.getElementById('release-export').click();
  check('Exporta a sprint exibida e restaura título',printed===1 && printedTitle==='Release da sprint - Sprint 17' && document.title===previousTitle);
  check('PDF inclui todos os grupos e restaura expansão da tela',printedGroups===4 && document.querySelectorAll('.release-group[open]').length===1);
  document.querySelector('.release-group summary').click();await tick();
  check('Categoria pode ser recolhida novamente',!document.querySelector('.release-group[open]'));
  document.querySelector('.release-group summary').click();await tick();
  const select=document.getElementById('release-sprint');select.value='18';select.dispatchEvent(new Event('change'));await tick();
  check('Troca de sprint atualiza entregas e aviso de comentários',document.getElementById('release-document').textContent.includes('Entrega da sprint 18') && !document.getElementById('release-warning').hidden);
  check('Troca de sprint recolhe categorias',!document.querySelector('.release-group[open]'));
  document.getElementById('release-export').click();check('PDF segue a sprint selecionada',printed===2 && printedTitle==='Release da sprint - Sprint 18');
  select.value='19';select.dispatchEvent(new Event('change'));await tick();check('Sprint vazia tem mensagem e nenhuma entrega',!document.getElementById('release-empty').hidden && !document.querySelector('.release-delivery'));
  mode='error';select.value='17';select.dispatchEvent(new Event('change'));await tick();check('Erro de obtenção visível',!document.getElementById('release-error').hidden && document.getElementById('release-error').textContent.includes('Sem conexão'));check('Exportação bloqueada após erro',document.getElementById('release-export').disabled);
  mode='race';select.value='18';select.dispatchEvent(new Event('change'));select.value='19';select.dispatchEvent(new Event('change'));await tick();pending(doc(18));await tick();
  check('Resposta antiga não substitui sprint mais recente',document.getElementById('release-count').textContent.includes('Sprint 19') && !document.querySelector('.release-delivery'));
  mode='success';SprintRelease.enter(17);await tick();
  check('Datas e última atualização presentes',document.getElementById('release-dates').textContent.includes('28/09/2026') && document.getElementById('release-updated').textContent.includes('Última atualização'));
  document.querySelector('.release-group summary').click();await tick();
  check('Release não recolhe o menu lateral',!document.body.classList.contains('sidebar-collapsed'));
  SprintRelease.leave();check('Saída remove modo release',!document.body.classList.contains('release-view'));SprintRelease.enter(17);await tick();
  check('Ao retornar à tela todas as categorias estão fechadas',!document.querySelector('.release-group[open]'));
  check('Logo oficial carregado',document.querySelector('.cap-heading img').getAttribute('src')==='../public/yuv-logo.png');
  if(new URLSearchParams(location.search).has('pages')){
    const large=doc(17);large.groups=large.groups.map(group=>({...group,count:30,items:Array.from({length:30},(_,index)=>({...group.items[0],id:`${group.type}-${index}`,title:`${group.items[0].title} · Entrega ${index+1}`}))}));large.total=120;
    window.mondayRequest=async()=>large;SprintRelease.enter(17);await tick();
    check('Release extensa mantém todas as entregas para impressão',document.querySelectorAll('.release-delivery').length===120);
  }
  document.getElementById('test-result').textContent=checks.join('\n')+'\nALL PASSED';
 }catch(error){document.getElementById('test-result').textContent=checks.join('\n')+'\nERROR '+error.stack;}
})();
</script></html>
