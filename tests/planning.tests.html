<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Planning · carga do time · testes</title>
<link rel="stylesheet" href="../public/planning.css"><link rel="stylesheet" href="../public/teams.css">
<style>#test-result{position:fixed;left:0;bottom:0;max-height:40%;overflow:auto;z-index:100;background:white;font-size:10px;margin:0}</style>
<main class="main"><div class="content"><div class="pp-game" id="fixture"><section id="pp-load" class="pp-load" hidden></section></div></div></main><pre id="test-result">RUNNING</pre>
<script>
const load = src => new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = src; script.onload = resolve; script.onerror = reject; document.body.append(script); });
const person = (name, team, inSprint, planned, support, capacity) => ({name, team, inSprint, planned, support, total: inSprint + planned, capacity, percent: capacity ? Math.round((inSprint + planned) / capacity * 100) : null});
(async () => {
  const checks = []; const check = (name, condition) => { checks.push(`${condition ? 'PASS' : 'FAIL'} ${name}`); if (!condition) throw new Error(name); };
  try {
    const dashboard = await (await fetch('../resources/views/dashboard.blade.php')).text();
    const style = document.createElement('style'); style.textContent = dashboard.match(/<style>([\s\S]*?)<\/style>/)[1]; document.head.prepend(style);
    await load('../public/sprint-rules.js'); await load('../public/planning.js');
    // Full stack: 2 × 80h = 160h − Bombeiro 40h = 120h; Ana tem 10h de Suporte, que contam no Bombeiro.
    const people = [person('Ana', 'fullstack', 60, 10, 10, 80), person('Bruno', 'fullstack', 30, 20, 0, 80), person('Carla', 'projects', 30, 8, 0, 40)];
    const [fullstack, projects] = Planning.teamLoad(people, 40);
    check('Full stack: capacidade menos o Bombeiro e planejado sem os cards de Suporte', fullstack.capacity === 120 && fullstack.planned === 110 && fullstack.available === 10 && fullstack.plannedPercent === 92 && fullstack.availablePercent === 8 && fullstack.level === 'yellow');
    check('Projetos: capacidade e horas próprias', projects.capacity === 40 && projects.planned === 38 && projects.available === 2 && projects.plannedPercent === 95 && projects.availablePercent === 5);
    check('Sem times classificados (reserva 0): sem desconto do Bombeiro', Planning.teamLoad(people, 0)[0].capacity === 160);
    const over = Planning.teamLoad([person('Ana', 'fullstack', 100, 0, 0, 80)], 0)[0];
    check('Acima da capacidade fica vermelho com o excedente', over.available === -20 && over.level === 'red' && over.plannedPercent === 125);
    Planning.renderLoad({session: {sprintName: 'Sprint 20'}, round: {item: {owner: 'Bruno'}}, reserveHours: 40, load: people});
    const parts = [...document.querySelectorAll('#pp-load .pp-load-team')];
    const text = node => node.textContent.replace(/\s+/g, ' ');
    check('Duas partes no mesmo card, cada uma com as suas pessoas', parts.length === 2 && parts[0].querySelectorAll('.pp-load-row').length === 2 && parts[1].querySelectorAll('.pp-load-row').length === 1 && text(parts[1]).includes('Carla'));
    const stats = node => [...node.querySelectorAll('.pp-load-stats > div')].map(stat => `${stat.querySelector('dt').textContent} ${stat.querySelector('dd').textContent}`).join(' | ');
    check('Capacidade, planejado e disponível em horas e %', stats(parts[0]) === 'Capacidade 120h | Planejado 110h 92% | Disponível 10h 8%' && stats(parts[1]) === 'Capacidade 40h | Planejado 38h 95% | Disponível 2h 5%');
    check('Responsável pela carta continua destacado', parts[0].querySelector('.pp-load-row.owner').textContent.includes('Bruno'));

    // Presentes e tempo das cerimônias (mesmo formato na Planning, na Daily e na Retro).
    await load('../public/ceremony.js');
    check('Cronômetro e duração', Ceremony.clock(65) === '1:05' && Ceremony.clock(3725) === '1:02:05' && Ceremony.duration(20) === 'menos de 1 min' && Ceremony.duration(840) === '14 min' && Ceremony.duration(3900) === '1h 05min');
    const bar = document.createElement('div');
    bar.innerHTML = Ceremony.barHtml({present: ['Ana', 'Bruno', 'Carla'], seconds: 3720, label: 'Planning'});
    check('Barra da sala: presentes agora e o tempo, sem previsto', text(bar).includes('3 na sala') && text(bar).includes('Planning 1:02:00') && !bar.querySelector('.cer-alert'));
    bar.innerHTML = Ceremony.barHtml({present: [], seconds: 1000, label: 'Daily', targetMinutes: 15});
    check('Com previsto: alerta quando passa', text(bar).includes('ninguém na sala agora') && text(bar).includes('de 15:00') && bar.querySelector('.cer-alert'));
    bar.innerHTML = Ceremony.attendanceHtml(['A', 'B', 'C', 'D', 'E', 'F', 'G'], 2400);
    check('Histórico: até 5 rostos, o resto em +N, contagem e duração', bar.querySelectorAll('.cer-av').length === 6 && bar.querySelector('.cer-av-more').textContent === '+2' && text(bar).includes('👥 7 · ⏱ 40 min'));
    document.getElementById('test-result').textContent = checks.join('\n') + '\nALL PASSED';
  } catch (error) { document.getElementById('test-result').textContent = checks.join('\n') + '\nERROR ' + error.stack; }
})();
</script></html>
