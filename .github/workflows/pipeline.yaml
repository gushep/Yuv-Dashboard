name: Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  image:
    needs: tests
    uses: jimibrasil/yuv-ci-workflows/.github/workflows/image.yml@v2
    with:
      push: true
      release: true
    secrets: inherit
    permissions:
      contents: write
      pull-requests: read
